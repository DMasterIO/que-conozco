    <script>
      (function () {
        try {
          var stored = localStorage.getItem('que-conozco-v1')
          var theme = 'system'
          if (stored) theme = (JSON.parse(stored).state || {}).theme || 'system'
          var dark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {}
      })()
    </script>
